"IoT Standard Library": "کتابخانه استاندارد IoT"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "کتابخانه استاندارد IoT که قراردادهای یکپارچه پروتکل ارتباطی را برای پلتفرم‌های IoT و درایورهای سخت‌افزاری تعریف می‌کند، بدون پیاده‌سازی‌های مشخص پروتکل."
"IoT Generic Database Driver": "درایور عمومی پایگاه داده IoT"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "درایور عمومی پایگاه داده IoT که نتایج پرس‌وجوهای SQL را از طریق لایه دسترسی به داده XCode به نقاط داده IoT نگاشت می‌کند و از چندین پایگاه داده پشتیبانی می‌کند."
"IoT Generic Serial Driver": "درایور عمومی پورت سریال IoT"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "درایور عمومی پورت سریال IoT که به چندین دستگاه اجازه می‌دهد یک پورت COM را به اشتراک بگذارند، با انتقال سریال داخلی."
"IoT Generic Network Driver": "درایور عمومی شبکه IoT"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "درایور عمومی شبکه IoT برای TCP، UDP و HTTP، با کشف پخش و انتقال‌های داخلی."
