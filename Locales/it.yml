# Glossario italiano. Le chiavi sono il testo originale inglese e devono corrispondere esattamente al codice sorgente; le chiavi mancanti tornano all'inglese in fase di esecuzione.
"Cannot find service [{0}]!": "Servizio [{0}] non trovato!"
"Unsupported data type {0}!": "Tipo di dati {0} non supportato!"
"================Start scanning driver plugins================": "================Avvio scansione dei plugin del driver================"
"================End scanning driver plugins================": "================Scansione dei plugin del driver completata================"
"Parameter cannot be null.": "Il parametro non può essere null."
"Serial port name cannot be null.": "Il nome della porta seriale non può essere null."
"Network address cannot be null.": "L'indirizzo di rete non può essere null."
"Node or parameter is invalid.": "Il nodo o il parametro non sono validi."
"Port number is required in parameters.": "Il numero di porta è obbligatorio nei parametri."
"UDP broadcast to {0}:{1}, payload: {2}": "Trasmissione UDP a {0}:{1}, payload: {2}"
"Received response from {0}:{1}, length: {2}": "Risposta ricevuta da {0}:{1}, lunghezza: {2}"
"Error receiving UDP response: {0}": "Errore durante la ricezione della risposta UDP: {0}"
"Error during UDP discovery on subnet {0}: {1}": "Errore durante l'individuazione UDP sulla subnet {0}: {1}"
"UDP device {0}:{1}": "Dispositivo UDP {0}:{1}"
"Database connection string cannot be null.": "La stringa di connessione del database non può essere null."
"Database driver does not support write operations.": "Il driver del database non supporta operazioni di scrittura."
"Database driver does not support control operations.": "Il driver del database non supporta operazioni di controllo del servizio."
"Driver plugin scanning is not supported under NativeAOT. Register drivers explicitly with DriverFactory.Register<T>.": "La scansione dei plug-in dei driver non è supportata in NativeAOT. Registra i driver in modo esplicito con DriverFactory.Register<T>."
"Short integer": "Intero corto"
"Integer": "Intero"
"Decimal number": "Numero decimale"
"Boolean": "Booleano"
"Byte": "Byte"
"Long integer": "Intero lungo"
"Double precision": "Doppia precisione"
"Text": "Testo"
"Time": "Ora"
"Response data": "Dati di risposta"
"Operation is not supported.": "L'operazione non è supportata."
"Service name cannot be null.": "Il nome del servizio non può essere null."
"Serial driver": "Driver seriale"
"TCP network driver": "Driver di rete TCP"
"UDP network driver": "Driver di rete UDP"
"HTTP driver": "Driver HTTP"
"Database driver": "Driver di database"
"Report on change": "Segnala alla modifica"
"Always report": "Segnala sempre"
"Never report": "Non segnalare mai"
"Serial port": "Porta seriale"
"Baud rate": "Velocità in baud"
"Data bits": "Bit di dati"
"Parity": "Parità"
"Stop bits": "Bit di stop"
"Timeout. Time to wait for a response after sending a request. Default 3000 ms.": "Timeout. Tempo di attesa di una risposta dopo l'invio di una richiesta. Predefinito 3000 ms."
"Byte timeout. Interval between data packets. Default 10 ms.": "Timeout byte. Intervallo tra pacchetti di dati. Predefinito 10 ms."
"Request command template. Supports hexadecimal (starting with 0x) and string formats.": "Modello di comando richiesta. Supporta formato esadecimale (inizia con 0x) e formato stringa."
"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "Codifica della risposta. Supporta HEX, ASCII, UTF8, Json, ecc."
"Capture all fields. Return all fields regardless of the specified points. Default false.": "Acquisisci tutti i campi. Restituisce tutti i campi indipendentemente dai punti specificati. Predefinito false."
"Server address. IP address or domain name, for example 127.0.0.1.": "Indirizzo del server. Indirizzo IP o nome di dominio, ad esempio 127.0.0.1."
"Port. For example 5500.": "Porta. Ad esempio 5500."
"Server address, for example http://star.newlifex.com:6600.": "Indirizzo del server, ad esempio http://star.newlifex.com:6600."
"HTTP method. GET or POST. Default GET.": "Metodo HTTP. GET o POST. Predefinito GET."
"Resource path. Path portion of the request URL.": "Percorso della risorsa. Parte del percorso dell'URL della richiesta."
"Token. Sent in the request header.": "Token. Inviato nell'intestazione della richiesta."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Timeout. Tempo di attesa di una risposta dopo l'invio di una richiesta. Predefinito 5000 ms."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Dati di pubblicazione. Supporta formato esadecimale (inizia con 0x) e formato stringa."
"Database connection string, for example server=.;database=iot;user=iot;******.": "Stringa di connessione al database, ad esempio server=.;database=iot;user=iot;******."
"Database type": "Tipo di database"
"Query. Select query; each column name maps to a point name.": "Query. Query Select; ogni nome di colonna corrisponde a un nome di punto."
"Ready": "Pronto"
"Processing": "In elaborazione"
"Completed": "Completato"
"Cancelled": "Annullato"
"Error": "Errore"
