"IoT Standard Library": "Βασική βιβλιοθήκη IoT"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "Βασική βιβλιοθήκη IoT που ορίζει ενοποιημένα συμβόλαια πρωτοκόλλων επικοινωνίας για πλατφόρμες IoT και προγράμματα οδήγησης υλικού, χωρίς συγκεκριμένες υλοποιήσεις πρωτοκόλλων."
"IoT Generic Database Driver": "Γενικό πρόγραμμα οδήγησης βάσης δεδομένων IoT"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "Γενικό πρόγραμμα οδήγησης βάσης δεδομένων IoT που αντιστοιχίζει αποτελέσματα ερωτημάτων SQL σε σημεία δεδομένων IoT μέσω του επιπέδου πρόσβασης δεδομένων XCode, υποστηρίζοντας πολλαπλές βάσεις δεδομένων."
"IoT Generic Serial Driver": "Γενικό πρόγραμμα οδήγησης σειριακής θύρας IoT"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "Γενικό πρόγραμμα οδήγησης σειριακής θύρας IoT που επιτρέπει σε πολλές συσκευές να μοιράζονται μία θύρα COM, με ενσωματωμένη σειριακή μεταφορά."
"IoT Generic Network Driver": "Γενικό πρόγραμμα οδήγησης δικτύου IoT"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "Γενικό πρόγραμμα οδήγησης δικτύου IoT για TCP, UDP και HTTP, με ανακάλυψη μέσω εκπομπής και ενσωματωμένες μεταφορές."
