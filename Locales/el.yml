"HTTP method. GET or POST. Default GET.": "Μέθοδος HTTP. GET ή POST. Προεπιλογή GET."
"Resource path. Path portion of the request URL.": "Διαδρομή πόρου. Το τμήμα διαδρομής του URL αιτήματος."
"Token. Sent in the request header.": "Διακριτικό. Αποστέλλεται στην κεφαλίδα αιτήματος."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Χρονικό όριο. Χρόνος αναμονής για απόκριση μετά την αποστολή αιτήματος. Προεπιλογή 5000 ms."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Δεδομένα ανάρτησης. Υποστηρίζει δεκαεξαδική μορφή (ξεκινά με 0x) και μορφή συμβολοσειράς."
