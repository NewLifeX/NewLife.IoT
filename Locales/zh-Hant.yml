# 繁體中文詞表。鍵為英文原文，與原始碼字串逐字一致；缺少的鍵於執行時回退英文。
"Cannot find service [{0}]!": "找不到服務[{0}]！"
"Unsupported data type {0}!": "不支援的資料類型 {0}！"
"================Start scanning driver plugins================": "================開始掃描驅動外掛================"
"================End scanning driver plugins================": "================結束掃描驅動外掛================"
"Parameter cannot be null.": "參數不能為空。"
"Serial port name cannot be null.": "序列埠名稱不能為空。"
"Network address cannot be null.": "網路位址不能為空。"
"Node or parameter is invalid.": "節點或參數無效。"
"Port number is required in parameters.": "參數中必須包含連接埠號碼。"
"UDP broadcast to {0}:{1}, payload: {2}": "UDP廣播傳送到 {0}:{1}，內容：{2}"
"Received response from {0}:{1}, length: {2}": "收到來自 {0}:{1} 的回應，長度：{2}"
"Error receiving UDP response: {0}": "接收UDP回應時發生錯誤：{0}"
"Error during UDP discovery on subnet {0}: {1}": "在子網 {0} 上進行UDP探索時發生錯誤：{1}"
"UDP device {0}:{1}": "UDP裝置 {0}:{1}"
"Database connection string cannot be null.": "資料庫連線字串不能為空。"
"Database driver does not support write operations.": "資料庫驅動不支援寫入操作。"
"Database driver does not support control operations.": "資料庫驅動不支援服務控制操作。"
