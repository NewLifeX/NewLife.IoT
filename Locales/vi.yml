"HTTP method. GET or POST. Default GET.": "Phương thức HTTP. GET hoặc POST. Mặc định GET."
"Resource path. Path portion of the request URL.": "Đường dẫn tài nguyên. Phần đường dẫn của URL yêu cầu."
"Token. Sent in the request header.": "Mã thông báo. Được gửi trong tiêu đề yêu cầu."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Thời gian chờ. Thời gian chờ phản hồi sau khi gửi yêu cầu. Mặc định 5000 ms."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Dữ liệu đăng. Hỗ trợ định dạng thập lục phân (bắt đầu bằng 0x) và định dạng chuỗi."
