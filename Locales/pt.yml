# Glossário em português. As chaves são o texto original em inglês e devem coincidir literalmente com o código; chaves ausentes usam inglês em tempo de execução.
"Cannot find service [{0}]!": "Serviço [{0}] não encontrado!"
"Unsupported data type {0}!": "Tipo de dados não suportado {0}!"
"================Start scanning driver plugins================": "================Início da verificação de plugins de driver================"
"================End scanning driver plugins================": "================Fim da verificação de plugins de driver================"
"Parameter cannot be null.": "O parâmetro não pode ser nulo."
"Serial port name cannot be null.": "O nome da porta serial não pode ser nulo."
"Network address cannot be null.": "O endereço de rede não pode ser nulo."
"Node or parameter is invalid.": "O nó ou o parâmetro é inválido."
"Port number is required in parameters.": "O número da porta é obrigatório nos parâmetros."
"UDP broadcast to {0}:{1}, payload: {2}": "Difusão UDP para {0}:{1}, carga útil: {2}"
"Received response from {0}:{1}, length: {2}": "Resposta recebida de {0}:{1}, comprimento: {2}"
"Error receiving UDP response: {0}": "Erro ao receber a resposta UDP: {0}"
"Error during UDP discovery on subnet {0}: {1}": "Erro durante a descoberta UDP na sub-rede {0}: {1}"
"UDP device {0}:{1}": "Dispositivo UDP {0}:{1}"
"Database connection string cannot be null.": "A cadeia de conexão do banco de dados não pode ser nula."
"Database driver does not support write operations.": "O driver de banco de dados não suporta operações de escrita."
"Database driver does not support control operations.": "O driver de banco de dados não suporta operações de controle de serviço."
"Driver plugin scanning is not supported under NativeAOT. Register drivers explicitly with DriverFactory.Register<T>.": "A verificação de plug-ins de drivers não é suportada no NativeAOT. Registre os drivers explicitamente com DriverFactory.Register<T>."
