# Glossário em português. As chaves são o texto original em inglês e devem coincidir literalmente com o código; chaves ausentes usam inglês em tempo de execução.
"Cannot find service [{0}]!": "Serviço [{0}] não encontrado!"
"Unsupported data type {0}!": "Tipo de dados não suportado {0}!"
"================Start scanning driver plugins================": "================Início da verificação de plugins de driver================"
"================End scanning driver plugins================": "================Fim da verificação de plugins de driver================"
"Parameter cannot be null.": "O parâmetro não pode ser nulo."
"Serial port name cannot be null.": "O nome da porta serial não pode ser nulo."
"Network address cannot be null.": "O endereço de rede não pode ser nulo."
"Node or parameter is invalid.": "O nó ou o parâmetro é inválido."
"Port number is required in parameters.": "O número da porta é obrigatório nos parâmetros."
"UDP broadcast to {0}:{1}, payload: {2}": "Difusão UDP para {0}:{1}, carga útil: {2}"
"Received response from {0}:{1}, length: {2}": "Resposta recebida de {0}:{1}, comprimento: {2}"
"Error receiving UDP response: {0}": "Erro ao receber a resposta UDP: {0}"
"Error during UDP discovery on subnet {0}: {1}": "Erro durante a descoberta UDP na sub-rede {0}: {1}"
"UDP device {0}:{1}": "Dispositivo UDP {0}:{1}"
"Database connection string cannot be null.": "A cadeia de conexão do banco de dados não pode ser nula."
"Database driver does not support write operations.": "O driver de banco de dados não suporta operações de escrita."
"Database driver does not support control operations.": "O driver de banco de dados não suporta operações de controle de serviço."
"Driver plugin scanning is not supported under NativeAOT. Register drivers explicitly with DriverFactory.Register<T>.": "A verificação de plug-ins de drivers não é suportada no NativeAOT. Registre os drivers explicitamente com DriverFactory.Register<T>."
"Short integer": "Inteiro curto"
"Integer": "Inteiro"
"Decimal number": "Número decimal"
"Boolean": "Booleano"
"Byte": "Byte"
"Long integer": "Inteiro longo"
"Double precision": "Precisão dupla"
"Text": "Texto"
"Time": "Hora"
"Response data": "Dados de resposta"
"Operation is not supported.": "A operação não é suportada."
"Service name cannot be null.": "O nome do serviço não pode ser nulo."
"Serial driver": "Driver de porta serial"
"TCP network driver": "Driver de rede TCP"
"UDP network driver": "Driver de rede UDP"
"HTTP driver": "Driver HTTP"
"Database driver": "Driver de banco de dados"
"Report on change": "Informar ao alterar"
"Always report": "Informar sempre"
"Never report": "Nunca informar"
"Serial port": "Porta serial"
"Baud rate": "Taxa de transmissão"
"Data bits": "Bits de dados"
"Parity": "Paridade"
"Stop bits": "Bits de parada"
"Timeout. Time to wait for a response after sending a request. Default 3000 ms.": "Tempo limite. Tempo de espera por uma resposta após enviar uma solicitação. Padrão 3000 ms."
"Byte timeout. Interval between data packets. Default 10 ms.": "Tempo limite de byte. Intervalo entre pacotes de dados. Padrão 10 ms."
"Request command template. Supports hexadecimal (starting with 0x) and string formats.": "Modelo de comando de solicitação. Suporta formato hexadecimal (começa com 0x) e formato de cadeia."
"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "Codificação de resposta. Suporta HEX, ASCII, UTF8, Json, etc."
"Capture all fields. Return all fields regardless of the specified points. Default false.": "Capturar todos os campos. Retorna todos os campos independentemente dos pontos especificados. Padrão false."
"Server address. IP address or domain name, for example 127.0.0.1.": "Endereço do servidor. Endereço IP ou nome de domínio, por exemplo 127.0.0.1."
"Port. For example 5500.": "Porta. Por exemplo 5500."
"Server address, for example http://star.newlifex.com:6600.": "Endereço do servidor, por exemplo http://star.newlifex.com:6600."
"HTTP method. GET or POST. Default GET.": "Método HTTP. GET ou POST. Padrão GET."
"Resource path. Path portion of the request URL.": "Caminho do recurso. Parte do caminho da URL da solicitação."
"Token. Sent in the request header.": "Token. Enviado no cabeçalho da solicitação."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Tempo limite. Tempo de espera por uma resposta após enviar uma solicitação. Padrão 5000 ms."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Dados de postagem. Suporta formato hexadecimal (começa com 0x) e formato de cadeia."
"Database connection string, for example server=.;database=iot;user=iot;******.": "Cadeia de conexão do banco de dados, por exemplo server=.;database=iot;user=iot;******."
"Database type": "Tipo de banco de dados"
"Query. Select query; each column name maps to a point name.": "Consulta. Consulta Select; cada nome de coluna mapeia para um nome de ponto."
"Ready": "Pronto"
"Processing": "Processando"
"Completed": "Concluído"
"Cancelled": "Cancelado"
"Error status": "Erro"
"IoT Standard Library": "Biblioteca padrão de IoT"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "Biblioteca padrão de IoT que define contratos unificados de protocolo de comunicação para plataformas IoT e drivers de hardware, sem implementações concretas de protocolo."
"IoT Generic Database Driver": "Driver genérico de banco de dados IoT"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "Driver genérico de banco de dados IoT que mapeia resultados de consultas SQL para pontos de dados IoT por meio da camada de acesso a dados XCode, com suporte a vários bancos de dados."
"IoT Generic Serial Driver": "Driver serial genérico de IoT"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "Driver serial genérico de IoT que permite que vários dispositivos compartilhem uma porta COM, com transporte serial integrado."
"IoT Generic Network Driver": "Driver de rede genérico de IoT"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "Driver de rede genérico de IoT para TCP, UDP e HTTP, com descoberta por broadcast e transportes integrados."
