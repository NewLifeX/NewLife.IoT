"IoT Standard Library": "Biblioteka standardowa IoT"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "Biblioteka standardowa IoT definiująca ujednolicone kontrakty protokołów komunikacyjnych dla platform IoT i sterowników sprzętowych, bez konkretnych implementacji protokołów."
"IoT Generic Database Driver": "Ogólny sterownik bazy danych IoT"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "Ogólny sterownik bazy danych IoT mapujący wyniki zapytań SQL na punkty danych IoT przez warstwę dostępu do danych XCode, obsługujący wiele baz danych."
"IoT Generic Serial Driver": "Ogólny sterownik portu szeregowego IoT"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "Ogólny sterownik portu szeregowego IoT umożliwiający wielu urządzeniom współdzielenie jednego portu COM, z wbudowaną warstwą transmisji szeregowej."
"IoT Generic Network Driver": "Ogólny sterownik sieciowy IoT"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "Ogólny sterownik sieciowy IoT dla TCP, UDP i HTTP, z wykrywaniem rozgłoszeniowym i wbudowanymi warstwami transmisji."
