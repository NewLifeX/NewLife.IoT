# Український словник. Ключі — англійський оригінальний текст, вони мають точно збігатися з кодом; відсутні ключі під час виконання повертаються до англійської.
"Cannot find service [{0}]!": "Службу [{0}] не знайдено!"
"Unsupported data type {0}!": "Непідтримуваний тип даних {0}!"
"================Start scanning driver plugins================": "================Початок сканування модулів драйверів================"
"================End scanning driver plugins================": "================Сканування модулів драйверів завершено================"
"Parameter cannot be null.": "Параметр не може бути null."
"Serial port name cannot be null.": "Ім'я послідовного порту не може бути null."
"Network address cannot be null.": "Мережева адреса не може бути null."
"Node or parameter is invalid.": "Вузол або параметр недійсний."
"Port number is required in parameters.": "У параметрах потрібно вказати номер порту."
"UDP broadcast to {0}:{1}, payload: {2}": "UDP-трансляція на {0}:{1}, корисне навантаження: {2}"
"Received response from {0}:{1}, length: {2}": "Отримано відповідь від {0}:{1}, довжина: {2}"
"Error receiving UDP response: {0}": "Помилка під час отримання UDP-відповіді: {0}"
"Error during UDP discovery on subnet {0}: {1}": "Помилка під час UDP-виявлення в підмережі {0}: {1}"
"UDP device {0}:{1}": "UDP-пристрій {0}:{1}"
"Database connection string cannot be null.": "Рядок підключення до бази даних не може бути null."
"Database driver does not support write operations.": "Драйвер бази даних не підтримує операції запису."
"Database driver does not support control operations.": "Драйвер бази даних не підтримує операції керування службою."
"Driver plugin scanning is not supported under NativeAOT. Register drivers explicitly with DriverFactory.Register<T>.": "Сканування модулів драйверів не підтримується в NativeAOT. Зареєструйте драйвери явно за допомогою DriverFactory.Register<T>."
"Short integer": "Коротке ціле"
"Integer": "Ціле число"
"Decimal number": "Десяткове число"
"Boolean": "Логічне значення"
"Byte": "Байт"
"Long integer": "Довге ціле"
"Double precision": "Подвійна точність"
"Text": "Текст"
"Time": "Час"
"Response data": "Дані відповіді"
"Operation is not supported.": "Операція не підтримується."
"Service name cannot be null.": "Ім'я служби не може бути пустим."
"Serial driver": "Драйвер послідовного порту"
"TCP network driver": "Мережевий драйвер TCP"
"UDP network driver": "Мережевий драйвер UDP"
"HTTP driver": "Драйвер HTTP"
"Database driver": "Драйвер бази даних"
"Report on change": "Повідомляти про зміну"
"Always report": "Повідомляти завжди"
"Never report": "Ніколи не повідомляти"
"Serial port": "Послідовний порт"
"Baud rate": "Швидкість передачі"
"Data bits": "Біти даних"
"Parity": "Парність"
"Stop bits": "Стоп-біти"
"Timeout. Time to wait for a response after sending a request. Default 3000 ms.": "Тайм-аут. Час очікування відповіді після надсилання запиту. За замовчуванням 3000 мс."
"Byte timeout. Interval between data packets. Default 10 ms.": "Тайм-аут байта. Інтервал між пакетами даних. За замовчуванням 10 мс."
"Request command template. Supports hexadecimal (starting with 0x) and string formats.": "Шаблон команди запиту. Підтримує шістнадцятковий формат (починається з 0x) і рядковий формат."
"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "Кодування відповіді. Підтримує HEX, ASCII, UTF8, Json тощо."
"Capture all fields. Return all fields regardless of the specified points. Default false.": "Захоплювати всі поля. Повертати всі поля незалежно від указаних точок. За замовчуванням false."
"Server address. IP address or domain name, for example 127.0.0.1.": "Адреса сервера. IP-адреса або доменне ім'я, наприклад 127.0.0.1."
"Port. For example 5500.": "Порт. Наприклад 5500."
"Server address, for example http://star.newlifex.com:6600.": "Адреса сервера, наприклад http://star.newlifex.com:6600."
"HTTP method. GET or POST. Default GET.": "Метод HTTP. GET або POST. За замовчуванням GET."
"Resource path. Path portion of the request URL.": "Шлях ресурсу. Частина шляху URL-адреси запиту."
"Token. Sent in the request header.": "Токен. Надсилається в заголовку запиту."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Тайм-аут. Час очікування відповіді після надсилання запиту. За замовчуванням 5000 мс."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Дані публікації. Підтримує шістнадцятковий формат (починається з 0x) і рядковий формат."
"Database connection string, for example server=.;database=iot;user=iot;******.": "Рядок підключення до бази даних, наприклад server=.;database=iot;user=iot;******."
"Database type": "Тип бази даних"
"Query. Select query; each column name maps to a point name.": "Запит. Запит Select; кожне ім'я стовпця відповідає імені точки."
"Ready": "Готово"
"Processing": "Обробляється"
"Completed": "Завершено"
"Cancelled": "Скасовано"
"Error status": "Помилка"
"IoT Standard Library": "Стандартна бібліотека IoT"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "Стандартна бібліотека IoT, що визначає уніфіковані контракти протоколів зв'язку для IoT-платформ і драйверів обладнання без конкретних реалізацій протоколів."
"IoT Generic Database Driver": "Універсальний драйвер бази даних IoT"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "Універсальний драйвер бази даних IoT, який зіставляє результати SQL-запитів із точками даних IoT через рівень доступу до даних XCode та підтримує кілька баз даних."
"IoT Generic Serial Driver": "Універсальний драйвер послідовного порту IoT"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "Універсальний драйвер послідовного порту IoT, що дозволяє кільком пристроям спільно використовувати один порт COM, із вбудованою послідовною передачею."
"IoT Generic Network Driver": "Універсальний мережевий драйвер IoT"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "Універсальний мережевий драйвер IoT для TCP, UDP і HTTP з широкомовним виявленням і вбудованими транспортами."
