# Glossaire français. Les clés sont le texte original anglais et doivent correspondre littéralement au code ; les clés absentes utilisent l'anglais à l'exécution.
"Cannot find service [{0}]!": "Service [{0}] introuvable !"
"Unsupported data type {0}!": "Type de données non pris en charge {0} !"
"================Start scanning driver plugins================": "================Début de l'analyse des plugins de pilote================"
"================End scanning driver plugins================": "================Fin de l'analyse des plugins de pilote================"
"Parameter cannot be null.": "Le paramètre ne peut pas être nul."
"Serial port name cannot be null.": "Le nom du port série ne peut pas être nul."
"Network address cannot be null.": "L'adresse réseau ne peut pas être nulle."
"Node or parameter is invalid.": "Le nœud ou le paramètre est invalide."
"Port number is required in parameters.": "Le numéro de port est requis dans les paramètres."
"UDP broadcast to {0}:{1}, payload: {2}": "Diffusion UDP vers {0}:{1}, charge utile : {2}"
"Received response from {0}:{1}, length: {2}": "Réponse reçue de {0}:{1}, longueur : {2}"
"Error receiving UDP response: {0}": "Erreur lors de la réception de la réponse UDP : {0}"
"Error during UDP discovery on subnet {0}: {1}": "Erreur lors de la découverte UDP sur le sous-réseau {0} : {1}"
"UDP device {0}:{1}": "Appareil UDP {0}:{1}"
"Database connection string cannot be null.": "La chaîne de connexion de la base de données ne peut pas être nulle."
"Database driver does not support write operations.": "Le pilote de base de données ne prend pas en charge les opérations d'écriture."
"Database driver does not support control operations.": "Le pilote de base de données ne prend pas en charge les opérations de contrôle de service."
"Driver plugin scanning is not supported under NativeAOT. Register drivers explicitly with DriverFactory.Register<T>.": "L'analyse des plug-ins de pilotes n'est pas prise en charge sous NativeAOT. Enregistrez les pilotes explicitement avec DriverFactory.Register<T>."
"Short integer": "Entier court"
"Integer": "Entier"
"Decimal number": "Nombre décimal"
"Boolean": "Booléen"
"Byte": "Octet"
"Long integer": "Entier long"
"Double precision": "Double précision"
"Text": "Texte"
"Time": "Heure"
"Response data": "Données de réponse"
"Operation is not supported.": "L'opération n'est pas prise en charge."
"Service name cannot be null.": "Le nom du service ne peut pas être null."
"Serial driver": "Pilote de port série"
"TCP network driver": "Pilote réseau TCP"
"UDP network driver": "Pilote réseau UDP"
"HTTP driver": "Pilote HTTP"
"Database driver": "Pilote de base de données"
"Report on change": "Signaler en cas de changement"
"Always report": "Toujours signaler"
"Never report": "Ne jamais signaler"
"Serial port": "Port série"
"Baud rate": "Débit en bauds"
"Data bits": "Bits de données"
"Parity": "Parité"
"Stop bits": "Bits d'arrêt"
"Timeout. Time to wait for a response after sending a request. Default 3000 ms.": "Délai. Temps d'attente d'une réponse après l'envoi d'une requête. Par défaut 3000 ms."
"Byte timeout. Interval between data packets. Default 10 ms.": "Délai d'octet. Intervalle entre les paquets de données. Par défaut 10 ms."
"Request command template. Supports hexadecimal (starting with 0x) and string formats.": "Modèle de commande de requête. Prend en charge le format hexadécimal (commençant par 0x) et le format chaîne."
"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "Encodage de réponse. Prend en charge HEX, ASCII, UTF8, Json, etc."
"Capture all fields. Return all fields regardless of the specified points. Default false.": "Capturer tous les champs. Renvoie tous les champs quels que soient les points spécifiés. Par défaut false."
"Server address. IP address or domain name, for example 127.0.0.1.": "Adresse du serveur. Adresse IP ou nom de domaine, par exemple 127.0.0.1."
"Port. For example 5500.": "Port. Par exemple 5500."
"Server address, for example http://star.newlifex.com:6600.": "Adresse du serveur, par exemple http://star.newlifex.com:6600."
"HTTP method. GET or POST. Default GET.": "Méthode HTTP. GET ou POST. Par défaut GET."
"Resource path. Path portion of the request URL.": "Chemin de la ressource. Partie chemin de l'URL de la requête."
"Token. Sent in the request header.": "Jeton. Envoyé dans l'en-tête de la requête."
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "Délai. Temps d'attente d'une réponse après l'envoi d'une requête. Par défaut 5000 ms."
"Post data. Supports hexadecimal (starting with 0x) and string formats.": "Données de publication. Prend en charge le format hexadécimal (commençant par 0x) et le format chaîne."
"Database connection string, for example server=.;database=iot;user=iot;******.": "Chaîne de connexion à la base de données, par exemple server=.;database=iot;user=iot;******."
"Database type": "Type de base de données"
"Query. Select query; each column name maps to a point name.": "Requête. Requête Select ; chaque nom de colonne correspond à un nom de point."
"Ready": "Prêt"
"Processing": "En cours"
"Completed": "Terminé"
"Cancelled": "Annulé"
"Error": "Erreur"
