# Glossaire français. Les clés sont le texte original anglais et doivent correspondre littéralement au code ; les clés absentes utilisent l'anglais à l'exécution.
"Cannot find service [{0}]!": "Service [{0}] introuvable !"
"Unsupported data type {0}!": "Type de données non pris en charge {0} !"
"================Start scanning driver plugins================": "================Début de l'analyse des plugins de pilote================"
"================End scanning driver plugins================": "================Fin de l'analyse des plugins de pilote================"
"Parameter cannot be null.": "Le paramètre ne peut pas être nul."
"Serial port name cannot be null.": "Le nom du port série ne peut pas être nul."
"Network address cannot be null.": "L'adresse réseau ne peut pas être nulle."
"Node or parameter is invalid.": "Le nœud ou le paramètre est invalide."
"Port number is required in parameters.": "Le numéro de port est requis dans les paramètres."
"UDP broadcast to {0}:{1}, payload: {2}": "Diffusion UDP vers {0}:{1}, charge utile : {2}"
"Received response from {0}:{1}, length: {2}": "Réponse reçue de {0}:{1}, longueur : {2}"
"Error receiving UDP response: {0}": "Erreur lors de la réception de la réponse UDP : {0}"
"Error during UDP discovery on subnet {0}: {1}": "Erreur lors de la découverte UDP sur le sous-réseau {0} : {1}"
"UDP device {0}:{1}": "Appareil UDP {0}:{1}"
"Database connection string cannot be null.": "La chaîne de connexion de la base de données ne peut pas être nulle."
"Database driver does not support write operations.": "Le pilote de base de données ne prend pas en charge les opérations d'écriture."
"Database driver does not support control operations.": "Le pilote de base de données ne prend pas en charge les opérations de contrôle de service."
