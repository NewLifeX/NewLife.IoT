"Timeout. Time to wait for a response after sending a request. Default 3000 ms.": "টাইমআউট। অনুরোধ পাঠানোর পর প্রতিক্রিয়ার জন্য অপেক্ষার সময়। ডিফল্ট 3000 ms।"
"Byte timeout. Interval between data packets. Default 10 ms.": "বাইট টাইমআউট। ডেটা প্যাকেটের মধ্যে ব্যবধান। ডিফল্ট 10 ms।"
"Request command template. Supports hexadecimal (starting with 0x) and string formats.": "অনুরোধ কমান্ড টেমপ্লেট। হেক্সাডেসিমেল (0x দিয়ে শুরু) এবং স্ট্রিং ফরম্যাট সমর্থন করে।"
"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "প্রতিক্রিয়া এনকোডিং। HEX, ASCII, UTF8, Json ইত্যাদি সমর্থন করে।"
