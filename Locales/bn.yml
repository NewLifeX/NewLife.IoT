"Server address. IP address or domain name, for example 127.0.0.1.": "সার্ভার ঠিকানা। IP ঠিকানা বা ডোমেইন নাম, উদাহরণ 127.0.0.1।"
"Port. For example 5500.": "পোর্ট। উদাহরণ 5500।"
