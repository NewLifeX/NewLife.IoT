# Glosari bahasa Melayu. Kunci ialah teks asal bahasa Inggeris dan mesti sepadan tepat dengan kod sumber; kunci yang tiada kembali kepada bahasa Inggeris semasa runtime.
"Cannot find service [{0}]!": "Perkhidmatan [{0}] tidak ditemui!"
"Unsupported data type {0}!": "Jenis data {0} tidak disokong!"
