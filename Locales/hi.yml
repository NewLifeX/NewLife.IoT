"IoT Standard Library": "IoT मानक लाइब्रेरी"
"IoT standard library that defines unified communication protocol contracts for IoT platforms and hardware drivers, without concrete protocol implementations.": "IoT मानक लाइब्रेरी जो IoT प्लेटफ़ॉर्म और हार्डवेयर ड्राइवरों के लिए एकीकृत संचार प्रोटोकॉल अनुबंध परिभाषित करती है, बिना किसी ठोस प्रोटोकॉल कार्यान्वयन के।"
"IoT Generic Database Driver": "IoT सामान्य डेटाबेस ड्राइवर"
"Generic IoT database driver that maps SQL query results to IoT data points through the XCode data access layer, supporting multiple databases.": "IoT सामान्य डेटाबेस ड्राइवर जो XCode डेटा एक्सेस परत के माध्यम से SQL क्वेरी परिणामों को IoT डेटा बिंदुओं में मैप करता है और कई डेटाबेस का समर्थन करता है।"
"IoT Generic Serial Driver": "IoT सामान्य सीरियल ड्राइवर"
"Generic IoT serial port driver that lets multiple devices share one COM port, with a built-in serial transport.": "IoT सामान्य सीरियल ड्राइवर जो कई उपकरणों को एक COM पोर्ट साझा करने देता है, अंतर्निहित सीरियल ट्रांसपोर्ट के साथ।"
"IoT Generic Network Driver": "IoT सामान्य नेटवर्क ड्राइवर"
"Generic IoT network driver for TCP, UDP and HTTP, with broadcast discovery and built-in transports.": "TCP, UDP और HTTP के लिए IoT सामान्य नेटवर्क ड्राइवर, ब्रॉडकास्ट खोज और अंतर्निहित ट्रांसपोर्ट के साथ।"
