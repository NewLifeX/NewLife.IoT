"Port. For example 5500.": "पोर्ट। उदाहरण 5500."
"Server address, for example http://star.newlifex.com:6600.": "सर्वर पता, उदाहरण http://star.newlifex.com:6600."
"HTTP method. GET or POST. Default GET.": "HTTP विधि। GET या POST। डिफ़ॉल्ट GET."
"Resource path. Path portion of the request URL.": "संसाधन पथ। अनुरोध URL का पथ भाग।"
"Token. Sent in the request header.": "टोकन। अनुरोध हेडर में भेजा जाता है।"
"Timeout. Time to wait for a response after sending a request. Default 5000 ms.": "टाइमआउट। अनुरोध भेजने के बाद प्रतिक्रिया की प्रतीक्षा का समय। डिफ़ॉल्ट 5000 ms."
