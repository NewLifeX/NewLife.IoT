"Response encoding. Supports HEX, ASCII, UTF8, Json, etc.": "प्रतिक्रिया एन्कोडिंग। HEX, ASCII, UTF8, Json आदि का समर्थन करता है।"
"Capture all fields. Return all fields regardless of the specified points. Default false.": "सभी फ़ील्ड कैप्चर करें। निर्दिष्ट बिंदुओं की परवाह किए बिना सभी फ़ील्ड लौटाएं। डिफ़ॉल्ट false."
