name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  package:
    name: package smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Package consumer smoke
      shell: pwsh
      run: ./check-package-consumer.ps1

  build-test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Check English runtime messages
      shell: pwsh
      run: ./check-english-exceptions.ps1
    - name: Check locales
      shell: pwsh
      run: ./check-locales.ps1
    - name: Check README metrics
      shell: pwsh
      run: ./sync-readme-metrics.ps1 -Check
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release
    - name: Test (scalar instruction set)
      if: matrix.os == 'ubuntu-latest'
      env:
        DOTNET_EnableHWIntrinsic: 0
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release --no-build
