name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.IoT/**'
        - 'NewLife.IoTSocket/**'
        - 'NewLife.IoTSerial/**'
        - 'NewLife.IoTDatabase/**'
        - 'Locales/**'
        - 'Common/**'
  workflow_dispatch:

# GitHub Packages 推送需要 packages: write
permissions:
  contents: read
  packages: write

jobs:
  build-publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> $GITHUB_ENV
    - name: Build
      run: |
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.IoT/NewLife.IoT.csproj
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.IoTSocket/NewLife.IoTSocket.csproj
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.IoTSerial/NewLife.IoTSerial.csproj
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.IoTDatabase/NewLife.IoTDatabase.csproj
    - name: Package consumer smoke
      # 下游只加 PackageReference 的端到端验证；失败即不发包
      shell: pwsh
      run: ./tools/check-package-consumer.ps1
    - name: Publish to GitHub Packages
      # 备用镜像渠道，失败只告警，不阻断 NuGet.org 正式发布
      continue-on-error: true
      run: |
        dotnet nuget remove source github >/dev/null 2>&1 || true
        dotnet nuget add source https://nuget.pkg.github.com/NewLifeX/index.json \
          --name github --username ${{ github.repository_owner }} \
          --password ${{ github.token }} --store-password-in-clear-text
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source github
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
