name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    name: build (AOT analyzers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Build
      run: dotnet build -c Release

  smoke:
    name: smoke (${{ matrix.rid }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT toolchain
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT baseline
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }}
    - name: Run NativeAOT (Windows)
      if: runner.os == 'Windows'
      run: .\out\${{ matrix.rid }}\AotSmoke.exe
    - name: Run NativeAOT (Linux)
      if: runner.os == 'Linux'
      run: ./out/${{ matrix.rid }}/AotSmoke
